name: Create Stripe BRL Price

on:
  workflow_dispatch:

jobs:
  create-price:
    runs-on: ubuntu-latest

    steps:
      - name: Create BRL Price
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "❌ STRIPE_SECRET_KEY não configurada."
            exit 1
          fi

          RESPONSE="$(
            curl -fsS https://api.stripe.com/v1/prices \
              -u "$STRIPE_SECRET_KEY:" \
              -d currency=brl \
              -d unit_amount=999 \
              -d product=prod_VKIAAbCVZqSXQu \
              -d lookup_key=pkg_pocket_pro_brl \
              -d nickname="PKG Pocket Pro - BRL 9.99" \
              -d "metadata[app]=pkg-pocket" \
              -d "metadata[license]=pro"
          )"

          PRICE_ID="$(
            printf '%s' "$RESPONSE" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'
          )"

          echo "======================================"
          echo "✅ PRICE BRL CRIADO"
          echo "STRIPE_PRICE_ID=$PRICE_ID"
          echo "Valor: BRL 9.99"
          echo "Produto: prod_VKIAAbCVZqSXQu"
          echo "======================================"
