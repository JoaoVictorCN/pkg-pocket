name: Deploy PKG Pocket Pro API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudflare/pro-api

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required GitHub secrets
        shell: bash
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          [ -n "$CLOUDFLARE_API_TOKEN" ] || {
            echo "CLOUDFLARE_API_TOKEN ausente"
            exit 1
          }

          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "CLOUDFLARE_ACCOUNT_ID ausente"
            exit 1
          }

          [ -n "$STRIPE_SECRET_KEY" ] || {
            echo "STRIPE_SECRET_KEY ausente"
            exit 1
          }

          [ -n "$STRIPE_WEBHOOK_SECRET" ] || {
            echo "STRIPE_WEBHOOK_SECRET ausente"
            exit 1
          }

          [ -n "$MERCADOPAGO_ACCESS_TOKEN" ] || {
            echo "MERCADOPAGO_ACCESS_TOKEN ausente"
            exit 1
          }

          [ -n "$MERCADOPAGO_WEBHOOK_SECRET" ] || {
            echo "MERCADOPAGO_WEBHOOK_SECRET ausente"
            exit 1
          }

          echo "Secrets necessários presentes."

      - name: Validate live Stripe access
        shell: bash
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail

          LIVE_PRICE="price_1ULBAuAW7uGRei6w1WTS96uo"

          curl \
            --fail \
            --silent \
            --show-error \
            --get \
            --user "$STRIPE_SECRET_KEY:" \
            --data-urlencode "expand[]=currency_options" \
            "https://api.stripe.com/v1/prices/$LIVE_PRICE" \
            > stripe-live-price.json

          node - <<'NODE'
          const fs = require("fs");

          const p =
            JSON.parse(
              fs.readFileSync(
                "stripe-live-price.json",
                "utf8"
              )
            );

          if (
            p.id !==
            "price_1ULBAuAW7uGRei6w1WTS96uo"
          ) {
            throw new Error(
              "Price live incorreto"
            );
          }

          if (p.livemode !== true) {
            throw new Error(
              "Stripe ainda não está em live mode"
            );
          }

          if (p.unit_amount !== 999) {
            throw new Error(
              "Preço BRL incorreto"
            );
          }

          const c =
            p.currency_options || {};

          if (
            c.brl?.unit_amount !== 999 ||
            c.usd?.unit_amount !== 199 ||
            c.eur?.unit_amount !== 179 ||
            c.gbp?.unit_amount !== 149
          ) {
            throw new Error(
              "Preços regionais Stripe incorretos"
            );
          }

          console.log(
            "Stripe LIVE OK"
          );

          console.log(
            "Price:",
            p.id
          );

          console.log(
            "Product:",
            p.product
          );
          NODE

      - name: Validate Mercado Pago access
        shell: bash
        env:
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            -H "Authorization: Bearer $MERCADOPAGO_ACCESS_TOKEN" \
            https://api.mercadolibre.com/users/me \
            > mp-user.json

          node - <<'NODE'
          const fs = require("fs");

          const u =
            JSON.parse(
              fs.readFileSync(
                "mp-user.json",
                "utf8"
              )
            );

          if (!u.id) {
            throw new Error(
              "Access Token Mercado Pago inválido"
            );
          }

          console.log(
            "Mercado Pago credential OK"
          );
          NODE

      - name: Validate Worker syntax
        run: node --check worker.js

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Configure Stripe secret
        shell: bash
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail

          printf '%s' "$STRIPE_SECRET_KEY" |
            npx wrangler secret put STRIPE_SECRET_KEY \
              --config wrangler.toml

      - name: Configure Stripe webhook secret
        shell: bash
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          [ -n "$STRIPE_WEBHOOK_SECRET" ] || {
            echo "STRIPE_WEBHOOK_SECRET ausente"
            exit 1
          }

          printf '%s' "$STRIPE_WEBHOOK_SECRET" |
            npx wrangler secret put STRIPE_WEBHOOK_SECRET               --config wrangler.toml

      - name: Configure Mercado Pago access token
        shell: bash
        env:
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$MERCADOPAGO_ACCESS_TOKEN" |
            npx wrangler secret put MERCADOPAGO_ACCESS_TOKEN \
              --config wrangler.toml

      - name: Configure Mercado Pago webhook secret
        shell: bash
        env:
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          printf '%s' "$MERCADOPAGO_WEBHOOK_SECRET" |
            npx wrangler secret put MERCADOPAGO_WEBHOOK_SECRET \
              --config wrangler.toml

      - name: Deploy Pro API
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml

      - name: Health check
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          echo "Aguardando Worker..."
          sleep 5

          curl --fail --silent --show-error \
            https://pkg-pocket-api.wbjoaovictor.workers.dev/health \
            | tee health.json

          echo
          echo "Health recebido."

          node - <<'NODE'
          const fs = require("fs");

          const h =
            JSON.parse(
              fs.readFileSync(
                "health.json",
                "utf8"
              )
            );

          if (!h.ok)
            throw new Error(
              "Health retornou ok=false"
            );

          if (h.version !== 9)
            throw new Error(
              "Pro API não está na versão 9"
            );

          if (
            h.device_binding !==
            "sha256_android_id_v1"
          )
            throw new Error(
              "Device binding não está ativo"
            );


          if (
            h.pix_api !==
            "enabled"
          )
            throw new Error(
              "Pix nativo não está ativo"
            );

          if (
            h.online_validation_hours !== 12 ||
            h.offline_grace_hours !== 72
          )
            throw new Error(
              "Janela de validação Pro incorreta"
            );

          if (h.kv !== "connected")
            throw new Error(
              "KV não conectado"
            );

          if (
            h.mercado_pago !==
            "configured"
          )
            throw new Error(
              "Mercado Pago não configurado"
            );

          if (
            h.stripe !==
            "configured"
          )
            throw new Error(
              "Stripe não configurada"
            );

          if (
            h.stripe_environment !==
            "production"
          )
            throw new Error(
              "Stripe não está em produção"
            );

          if (
            h.mercado_pago_environment !==
            "production"
          )
            throw new Error(
              "Mercado Pago não está em produção"
            );

          if (
            h.stripe_webhook !==
            "configured"
          )
            throw new Error(
              "Webhook Stripe não configurado"
            );

          if (
            h.webhook_secret !==
            "configured"
          )
            throw new Error(
              "Webhook Mercado Pago não configurado"
            );

          console.log(
            "PKG Pocket Pro API OK"
          );

          console.log(
            "Stripe:",
            h.stripe
          );

          console.log(
            "Stripe webhook:",
            h.stripe_webhook
          );

          console.log(
            "Mercado Pago:",
            h.mercado_pago
          );
          NODE

      # PKGPOCKET_OWNER_ADMIN_GRANT
      - name: Ensure owner Admin Pro license
        working-directory: .
        shell: bash
        env:
          ADMIN_EMAIL: ${{ secrets.PKGPOCKET_ADMIN_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_EMAIL:-}" ]; then
            echo "PKGPOCKET_ADMIN_EMAIL não configurado; ignorando grant."
            exit 0
          fi

          EMAIL="$(
            printf '%s' "$ADMIN_EMAIL" |
              tr '[:upper:]' '[:lower:]' |
              xargs
          )"

          case "$EMAIL" in
            *@*.*) ;;
            *)
              echo "PKGPOCKET_ADMIN_EMAIL inválido"
              exit 1
              ;;
          esac

          EMAIL_HASH="$(
            printf '%s' "$EMAIL" |
              sha256sum |
              awk '{print $1}'
          )"

          NAMESPACE_ID="$(
            awk -F'"' '
              /^[[:space:]]*id[[:space:]]*=/ {
                print $2
                exit
              }
            ' cloudflare/pro-api/wrangler.toml
          )"

          test -n "$NAMESPACE_ID" || {
            echo "Namespace LICENSES não encontrado"
            exit 1
          }

          KEY="license:${EMAIL_HASH}"

          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NAMESPACE_ID}/values/${KEY}"

          TMP="$(mktemp)"
          HTTP="$(
            curl \
              --silent \
              --show-error \
              -o "$TMP" \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$API"
          )"

          if [ "$HTTP" = "200" ]; then
            PROVIDER="$(jq -r '.provider // ""' "$TMP" 2>/dev/null || true)"
            STATUS="$(jq -r '.status // ""' "$TMP" 2>/dev/null || true)"

            if [ "$STATUS" = "active" ] && [ "$PROVIDER" != "admin" ]; then
              echo "Este e-mail já possui uma licença Pro ativa normal; nada será sobrescrito."
              rm -f "$TMP"
              exit 0
            fi

            if [ "$STATUS" = "active" ] && [ "$PROVIDER" = "admin" ]; then
              echo "Licença Admin Pro já existe; preservando vínculo atual."
              rm -f "$TMP"
              exit 0
            fi
          elif [ "$HTTP" != "404" ]; then
            echo "Falha ao consultar KV: HTTP $HTTP"
            cat "$TMP" || true
            rm -f "$TMP"
            exit 1
          fi

          rm -f "$TMP"

          NOW="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"

          LICENSE="$(
            jq -nc \
              --arg emailHash "$EMAIL_HASH" \
              --arg now "$NOW" \
              '{
                version: 1,
                product: "pkg-pocket-pro",
                entitlement: "pro",
                status: "active",
                email_hash: $emailHash,
                active_device_hash: null,
                purchased_at: $now,
                activated_at: null,
                last_verified_at: $now,
                payment_id: "admin-grant",
                preference_id: null,
                provider: "admin",
                external_reference: ("admin:" + $emailHash),
                amount_minor: 0,
                currency: "ADMIN",
                transfer_available_at: null,
                updated_at: $now
              }'
          )"

          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "$LICENSE" \
              "$API"
          )"

          printf '%s' "$RESPONSE" |
            jq -e '.success == true' >/dev/null

          CHECK="$(
            curl \
              --fail \
              --silent \
              --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$API"
          )"

          printf '%s' "$CHECK" |
            jq -e '
              .provider == "admin" and
              .status == "active" and
              .active_device_hash == null
            ' >/dev/null

          echo "Admin Pro criado com sucesso."
          echo "O primeiro /status do APK vai vincular esta licença ao aparelho."

