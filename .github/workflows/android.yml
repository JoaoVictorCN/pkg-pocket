name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKGPOCKET_KEYSTORE_B64: ${{ secrets.PKGPOCKET_KEYSTORE_B64 }}
      PKGPOCKET_KEYSTORE_PASSWORD: ${{ secrets.PKGPOCKET_KEYSTORE_PASSWORD }}
      PKGPOCKET_KEY_ALIAS: ${{ secrets.PKGPOCKET_KEY_ALIAS }}
      PKGPOCKET_KEY_PASSWORD: ${{ secrets.PKGPOCKET_KEY_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create or reuse beta KV
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          LIST="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API")"
          ID="$(printf '%s' "$LIST"|jq -r '.result[]|select(.title=="pkg-pocket-beta-usage")|.id'|head -n1)"
          if [ -z "$ID" ]; then
            NEW="$(curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data '{"title":"pkg-pocket-beta-usage"}' "$API")"
            ID="$(printf '%s' "$NEW"|jq -r '.result.id')"
          fi
          test -n "$ID"
          sed "s/__KV_ID__/${ID}/" cloudflare/wrangler.template.toml > cloudflare/wrangler.toml
      - name: Deploy beta backend
        working-directory: cloudflare
        run: |
          set -euo pipefail
          OUT="$(npx --yes wrangler@4.41.1 deploy 2>&1|tee /dev/stderr)"
          URL="$(printf '%s\n' "$OUT"|grep -Eo 'https://[^ ]+\.workers\.dev'|tail -n1)"
          test -n "$URL"
          echo "PKGPOCKET_BETA_API_URL=$URL" >> "$GITHUB_ENV"
          curl -fsS "$URL/health"
      - name: Restore stable signing key
        if: env.PKGPOCKET_KEYSTORE_B64 != ''
        run: printf '%s' "$PKGPOCKET_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pkgpocket-signing.jks"
      - name: Build RELEASE APK only
        env:
          PKGPOCKET_KEYSTORE_PATH: ${{ runner.temp }}/pkgpocket-signing.jks
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-pocket-release-apk
          path: app/build/outputs/apk/release/app-release.apk
