name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        if: ${{ secrets.PKGPOCKET_KEYSTORE_B64 != '' }}
        env:
          PKGPOCKET_KEYSTORE_B64: ${{ secrets.PKGPOCKET_KEYSTORE_B64 }}
        run: |
          printf '%s' "$PKGPOCKET_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pkgpocket-signing.jks"

      - name: Build debug APK
        env:
          PKGPOCKET_KEYSTORE_PATH: ${{ runner.temp }}/pkgpocket-signing.jks
          PKGPOCKET_KEYSTORE_PASSWORD: ${{ secrets.PKGPOCKET_KEYSTORE_PASSWORD }}
          PKGPOCKET_KEY_ALIAS: ${{ secrets.PKGPOCKET_KEY_ALIAS }}
          PKGPOCKET_KEY_PASSWORD: ${{ secrets.PKGPOCKET_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-pocket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
